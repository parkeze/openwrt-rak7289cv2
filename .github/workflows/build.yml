name: build

# Set OPENWRT_VERSION, TARGET and SUBTARGET below for the device; build.sh is
# identical in every device repo and is not edited per device.
#
# A tag is a release: <openwrt-version>-<n>, e.g. 24.10.0-1. Its assets are laid
# out like a downloads.openwrt.org target directory, so a consumer swaps the
# base URL and keeps its checksum verification.

on:
  push:
    branches: [main]
    tags: ['*-*']
  pull_request:
  workflow_dispatch:

env:
  OPENWRT_VERSION: '24.10.0'
  TARGET: ramips
  SUBTARGET: mt76x8

jobs:
  build:
    # The template itself has no device to build.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the OpenWrt version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "${GITHUB_REF_NAME}" in
            "${OPENWRT_VERSION}"-*) ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} is not ${OPENWRT_VERSION}-<n>"; exit 1 ;;
          esac

      # The buildroot wants ~25GB; a stock runner has that only once the
      # preinstalled SDKs are gone.
      - name: Free disk and install the buildroot dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd
          df -h .

      # Source tarballs only; the build itself is not cacheable in 10GB.
      - uses: actions/cache@v4
        with:
          path: .build/openwrt/dl
          key: dl-${{ env.OPENWRT_VERSION }}-${{ hashFiles('devices/**') }}
          restore-keys: dl-${{ env.OPENWRT_VERSION }}-

      - run: ./build.sh "${OPENWRT_VERSION}" "${TARGET}" "${SUBTARGET}" out

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}
          path: out/*
          retention-days: 7

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
